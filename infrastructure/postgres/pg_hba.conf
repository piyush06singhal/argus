# ARGUS — pg_hba.conf for a deployment that replicates.
#
# Why the file is shipped instead of appended to: on a database that already
# has data, ``docker-entrypoint-initdb.d`` scripts never run again, so an
# "append the replication rule on first boot" approach silently does nothing on
# exactly the deployments that need it most. Mounting the whole file is
# deterministic and reviewable.
#
# It is the official image's generated default with one line added:
#
#     host replication all all scram-sha-256
#
# `all` in the *database* column does not match a physical replication
# connection — the well-known gotcha that produces "no pg_hba.conf entry for
# replication connection". It needs its own record.
#
# `local` (unix socket) stays `trust`: the socket only exists inside the
# container, nothing outside can reach it, and the image's own tooling
# (pg_isready, the entrypoint, pg_basebackup over the socket) depends on it.
# Every network connection, including replication, authenticates by password.
#
# The `local replication` record is here for the same reason the `host
# replication` one is: the database column `all` does not match a physical
# replication connection, so a socket base backup fails with "no pg_hba.conf
# entry for replication connection from host \"[local]\"" even though
# `local all all trust` is present. `docker compose exec` runs as root, which
# is why the user column is `all`.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
local   replication     all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
