# ARGUS — Prometheus configuration (hardening W10: self-observability).
#
# The gap this closes: ARGUS could be scraped but nothing scraped it. A platform
# whose product is reliability was the one system in the deployment with no
# alert rules of its own.
#
# Start it with the `observability` profile:
#
#     docker compose --profile observability up -d
#
# The target is the compose service name, not localhost: Prometheus runs inside
# the same network as the API, so this works the same on a laptop and on a host
# that never publishes port 8000.

global:
  #: 30s is deliberate. ARGUS's own series are computed by SQL aggregations over
  #: the last 24 hours on every scrape, so a tight interval costs database work
  #: and buys nothing: none of the signals here move on a seconds timescale.
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: argus

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: argus-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  #: Prometheus scraping itself, so a dashboard can distinguish "ARGUS is quiet"
  #: from "the scraper died".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
